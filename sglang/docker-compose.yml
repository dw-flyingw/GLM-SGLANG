# Pin the Compose project name instead of inheriting it from the directory.
# Inherited, it changes whenever the directory is renamed -- which silently
# orphans the running containers (teardown matches nothing while the worker
# holds all 8 GPUs) and the JIT cache volume (forcing a ~10-20 min DeepGEMM
# recompile). This survived the dynamo/ -> sglang/ rename precisely because
# it is pinned here.
name: glm52-sglang

# SGLang serving stack for GLM-family models on 8x H200.
# Currently configured for GLM-5.2-FP8 (${MODEL}); every default below is tuned to
# that model -- see README.md, "Serving a different GLM model", before swapping it.
#
# Engine: SGLang 0.5.13.post1 (custom image, see Dockerfile), serving the
# OpenAI-compatible API directly from sglang.launch_server. This used to run
# under NVIDIA Dynamo (etcd + NATS + a frontend process in front of the same
# worker); that was removed on 2026-09-11 because none of what Dynamo adds --
# multi-worker discovery, KV-aware routing, disaggregated prefill/decode -- is
# reachable on a single node with a single worker holding a ~756 GB model. The
# engine, the image, and every engine flag below are unchanged by that removal.
# SGLang auto-selects the DSA (DeepSeek-style Sparse Attention) kernels for
# GLM-5.2. (The image derives from a Dynamo base purely because no published
# vLLM runtime ships vLLM >= 0.23.0, which the vLLM path would need for
# head_size=704 sparse MLA -- see Dockerfile.)
#
# Topology: single-node, AGGREGATED tensor-parallel over all 8 GPUs (TP=8) + MTP/EAGLE
# speculative decoding. We benchmarked SGLang's "throughput" config (EP=8 +
# --enable-dp-attention) and it REGRESSED on every axis -- ~0.6x system
# tok/s at conc 32 and worse single-stream latency -- because DP-attention only pays
# off at hundreds of concurrent requests, while one node caps at 48 max-running-reqs
# (6/rank); below that the DP+EP all-to-all overhead isn't amortized, and the replicated
# attention weights shrink the KV pool (540k -> 292k tokens). So TP=8 stays. The EP+DP
# config is the right choice only on >= 2 nodes / very high concurrency. (Disaggregated
# prefill/decode -- a full model copy per worker -- also needs >= 2 nodes.)
#
# The worker uses host networking and binds :8000 on the host directly.

# Crash diagnostics for the SGLang worker. Merged into BOTH worker services
# (workers only -- the frontend holds no CUDA context and needs none).
#
# Why this exists: on 2026-09-03 the scheduler stalled mid-batch, the 300 s
# watchdog fired on all 8 ranks within 70 ms of each other (a collective hang,
# not a single-rank fault), and SGLang's crash handler produced NOTHING usable
# -- every py-spy dump hit "Permission Denied" (fixed by cap_add: SYS_PTRACE
# above) and the CUDA path bailed with "CUDA user-triggered coredump is not
# enabled. Set CUDA_ENABLE_USER_TRIGGERED_COREDUMP=1 before CUDA
# initialization." Root-caused nothing; the worker just died with exit 137.
x-coredump-env: &coredump-env
  CUDA_ENABLE_USER_TRIGGERED_COREDUMP: "1"
  # Where the dump LANDS. Must be set, and must be outside the KV tree.
  # Two independent hazards if it is left at the default (cwd = /workspace):
  #   1. /workspace is the container's ephemeral overlay, i.e. the 438 GB ROOT
  #      filesystem -- the same trap SGLANG_HICACHE_FILE_BACKEND_STORAGE_DIR
  #      exists to avoid.
  #   2. Anywhere under the reaper's root (/scratch/kvcache/glm52) is worse
  #      still: kv_reaper.py deletes the OLDEST REGULAR FILE of any name until
  #      the tree fits its byte budget -- it does not filter on .bin -- so a
  #      multi-GB dump would both be reaper-bait itself and evict real KV
  #      pages to pay for its own size.
  # /scratch/diag is a separate bind mount for exactly this (see DIAG_DIR
  # below), on the 28 TB NVMe, outside every reaped tree.
  # %h = hostname, %p = pid, so the 8 ranks cannot overwrite each other.
  CUDA_COREDUMP_FILE: "${DIAG_DIR:-/scratch/diag}/coredumps/core.cuda.%h.%p"
  # Dumping device global memory would write ~122 GB PER RANK -- ~1 TB per
  # incident for 8 ranks -- and none of it answers "which kernel is each rank
  # stuck in". skip_global_memory drops that bulk and keeps the parts that do:
  # backtraces, local and shared memory, ELF images. Flag names verified
  # against this host's driver (libcuda.so.1, CUDA 13.0), not assumed.
  CUDA_COREDUMP_GENERATION_FLAGS: "skip_global_memory"
  # NOTE: CUDA_COREDUMP_PIPE is deliberately NOT set. SGLang looks for the
  # user-trigger pipe at the driver's default -- cwd-relative
  # "corepipe.cuda.%h.%p", i.e. /workspace/corepipe.cuda.<host>.<pid>, which is
  # verbatim the path the 2026-09-03 logs reported missing. Overriding it would
  # move the pipe out from under the code that triggers the dump. The pipe is a
  # FIFO (no data at rest), so leaving it on the overlay costs nothing.

# Shared base for SGLang worker services (Profile A "cache" below; Profile B
# "longctx" is added alongside it on this branch). YAML merge (<<:) replaces
# whole keys wholesale, so profiles/environment/volumes/command stay spelled
# out explicitly in each worker service rather than living here.
x-worker-base: &worker-base
  image: ${SGLANG_IMAGE:-glm52-sglang:0.5.13post1}
  network_mode: host
  gpus: all
  ipc: host
  # The image runs the worker directly as pid 1, with no init to reap children.
  # Without this, the container became UNKILLABLE on teardown: `./stop.sh`
  # reported "PID ... is zombie and can not be killed", `docker restart` failed
  # outright leaving the worker DOWN, and `docker compose up -d worker` refused
  # to recreate it -- all needing a manual `docker kill` first. docker-init as
  # pid 1 forwards signals and reaps, and that symptom is gone: stop and
  # recreate now complete unaided (verified 2026-08-31/09-01).
  #
  # It does NOT stop the exit-137 teardown, and cannot. Measured on a fully
  # loaded worker 2026-09-01: SIGTERM 01:41:51 -> engine shutdown complete
  # 01:41:57 -> container SIGKILLed 01:42:35. ExitCode 137, `docker stop` rc=1
  # after 24s. The cause is upstream and unrelated to reaping: the shutdown
  # handler calls kill_process_tree(parent_pid=<engine>, include_parent=False),
  # which kills the engine's children but never terminates the engine process
  # itself, so pid 1 waits on a child that never exits and docker SIGKILLs at
  # the stop timeout. The long tail after SIGKILL is most likely the kernel
  # reclaiming ~920 GB of pinned host pools (96 GB + 19.32 GB per rank x 8) --
  # plausible but NOT measured, so treat it as a hypothesis.
  #
  # 137 here is cosmetic: the graceful path already finished at +6s (endpoints
  # unregistered, engine shut down, KV files flushed). Everything after is
  # process teardown. Do not chase it without an upstream fix.
  init: true
  # py-spy needs ptrace to dump the Python stack of a hung rank. Without this,
  # SGLang's crash handler runs but every dump fails with "Permission Denied:
  # Try running again with elevated permissions" -- which is exactly what
  # happened on the 2026-09-03 watchdog kill, leaving no evidence of WHERE the
  # scheduler was stuck. py-spy targets processes in this container only.
  # (Incremental risk is small here: the worker already has network_mode: host,
  # gpus: all and ipc: host.)
  cap_add:
    - SYS_PTRACE
  ulimits:
    memlock: -1
    stack: 67108864
  entrypoint: ["python3", "-m", "sglang.launch_server"]
  restart: "no"

services:
  # Aggregated worker: full model, tensor-parallel over all 8 GPUs (TP=8) + MTP.
  worker:
    <<: *worker-base
    # Profile A: tiered KV cache (GPU radix -> host RAM L2 -> /scratch L3).
    # Mutually exclusive with worker-longctx: SGLang forbids hierarchical cache
    # together with --disable-radix-cache, which HiSparse requires.
    profiles: ["cache"]
    environment:
      <<: *coredump-env
      HF_HOME: "${HF_CACHE:-/root/.cache/huggingface}"
      HF_HUB_OFFLINE: "1"
      # HiCacheFile defaults to /tmp/hicache -- the 438 GB ROOT filesystem --
      # if this is unset, which would fill the boot disk. Setting it is not
      # optional. serve.sh fails fast if the directory is missing.
      SGLANG_HICACHE_FILE_BACKEND_STORAGE_DIR: "${KV_SCRATCH_DIR:-/scratch/kvcache/glm52}"
    volumes:
      - "${HF_CACHE:-/root/.cache/huggingface}:${HF_CACHE:-/root/.cache/huggingface}"
      # Persist JIT-compiled kernels (DeepGEMM, FlashInfer, Triton, tvm-ffi) across
      # container recreation so restarts skip the ~10-20 min DeepGEMM precompile +
      # warmup. The cache dir exists in the image owned by the 'dynamo' user, so the
      # named volume inherits that ownership on first mount (writes succeed).
      - "jit-cache:/home/dynamo/.cache"
      # L3 KV tier. Separate NVMe devices from /data (the weight cache), so
      # cache I/O does not contend with weight loading.
      - "${KV_SCRATCH_ROOT:-/scratch/kvcache}:${KV_SCRATCH_ROOT:-/scratch/kvcache}"
      # Crash-dump target (see x-coredump-env). Its own mount, deliberately NOT
      # a subdirectory of KV_SCRATCH_ROOT: the reaper walks that tree, and this
      # profile is the only one that mounts it at all.
      - "${DIAG_DIR:-/scratch/diag}:${DIAG_DIR:-/scratch/diag}"
    # SGLang engine args pass straight through. We let SGLang AUTO-SELECT the DSA
    # attention backend (no --attention-backend): on Hopper with fp8 KV it picks
    # flashmla_kv for prefill+decode.
    command:
      - --model-path=${MODEL:-zai-org/GLM-5.2-FP8}
      - --served-model-name=${SERVED_NAME:-glm-5.2-fp8}
      # The engine now serves the OpenAI API itself -- there is no separate
      # frontend process. network_mode: host means this binds the host's
      # interface directly, so the default is loopback ONLY. The model should
      # not be reachable over the network: front it with your own reverse proxy
      # or an SSH tunnel. Override with HTTP_HOST=0.0.0.0 (not recommended).
      - --host=${HTTP_HOST:-127.0.0.1}
      - --port=${PORT:-8000}
      - --tp-size=${TP_SIZE:-8}
      - --kv-cache-dtype=fp8_e4m3
      - --mem-fraction-static=${MEM_FRACTION:-0.85}
      # Concurrency ceiling. Spec decoding auto-caps this to 48; set it explicitly
      # to run more requests in parallel before they queue. KV pool is ~540k tokens,
      # so 128 leaves ~4k tokens/req of avg budget. Raise for high-concurrency
      # workloads (weigh against per-request decode speed). Override via MAX_RUNNING.
      - --max-running-requests=${MAX_RUNNING:-128}
      # DSA indexer requires page_size 64. (Backend is auto-selected -- see above.)
      - --page-size=${PAGE_SIZE:-64}
      # 1M is the model's max, but a single node can't hold a 1M-token KV cache
      # alongside the ~94 GB/GPU weights: at mem-fraction 0.85 the decode pool is
      # ~540k tokens (max_total_num_tokens=540800), so 512k is the largest length
      # a full-length request can actually be served at. (True 1M needs >= 2 nodes.)
      # Override with MAX_MODEL_LEN if you change memory.
      - --context-length=${MAX_MODEL_LEN:-524288}
      - --trust-remote-code
      # Native SGLang parsers. These were --dyn-* under Dynamo because the
      # FRONTEND did the parsing; sglang.launch_server rejects that spelling.
      - --tool-call-parser=${TOOL_PARSER:-glm47}
      - --reasoning-parser=${REASONING_PARSER:-glm45}
      # NOT OPTIONAL, and its absence is SILENT. This is what makes the server
      # populate usage.prompt_tokens_details.cached_tokens, which bench_stream.py
      # reads as a DIRECT count of prefix-cache hits -- the measurement behind
      # the whole tiered-KV result in RESULTS-kv-tiering.md. The Dynamo frontend
      # populated it for free. Drop this flag and there is no error: the field
      # just disappears and cache effectiveness has to be guessed from TTFT.
      - --enable-cache-report
      # Prometheus metrics on /metrics. NOT optional for observability: under
      # Dynamo the FRONTEND exposed dynamo_frontend_inflight_requests, TTFT/ITL
      # histograms and request counters, and that frontend is gone. Without this
      # flag sglang.launch_server serves no /metrics at all (it 404s), and the
      # only way to see inflight requests or latency is grepping worker logs.
      # Verified missing after the 2026-09-11 cutover; the runbook's three
      # checks do not cover it.
      - --enable-metrics
      # MTP speculative decoding: GLM-5.2 ships 1 MTP layer; EAGLE drives it from the
      # main checkpoint (no separate draft model). topk=1 => a draft chain, so
      # num-draft-tokens == num-steps + 1. Verified to compose with the auto-selected
      # DSA backend on H200 (accept len ~2.2-2.8); env-overridable for tuning.
      - --speculative-algorithm=${SPEC_ALGO:-EAGLE}
      - --speculative-num-steps=${SPEC_NUM_STEPS:-2}
      - --speculative-eagle-topk=${SPEC_EAGLE_TOPK:-1}
      - --speculative-num-draft-tokens=${SPEC_NUM_DRAFT:-3}
      # --- Tiered KV cache -------------------------------------------------
      # See docs/superpowers/specs/2026-08-31-scratch-kv-cache-tiering-design.md
      #
      # --hicache-size is PER TP RANK: HostKVCache.__init__ reads it as this
      # rank's own pool (host_size * 1e9 // size_per_token), so TP=8 allocates
      # it EIGHT times -- MLA makes all eight copies identical, but they are
      # still eight allocations. 96 GB/rank => ~770 GB of MLA host pool plus
      # 19.32 GB/rank of DSA indexer host pool = ~922 GB of the ~2168 GB free.
      # (19.32 GB/rank is the value the worker LOGS at startup -- "Allocating
      # 19.32 GB host memory for DSA indexer" x8 -- not the 22.0 GB/rank the
      # pre-work design doc estimated.)
      # SGLang hard-fails at startup if it over-requests, so raising this is
      # fail-safe, not fail-dangerous.
      - --enable-hierarchical-cache
      - --hicache-size=${HICACHE_GB:-96}
      # write_through writes EVERY page to the host and /scratch tiers synchronously.
      # Measured 2026-08-31: that costs ~8.7% system throughput at concurrency 32
      # (1905.2 vs 2087.1 tok/s baseline) while concurrency 1 is unaffected (-0.5%),
      # which is the signature of per-page write overhead concentrating where pages
      # are produced fastest. write_through_selective writes only hotter pages.
      # Override to A/B without editing this file.
      - --hicache-write-policy=${HICACHE_WRITE_POLICY:-write_through}
      # `kernel` I/O survives here: it is only downgraded to `direct` when the
      # effective DECODE backend is fa3, and ours is the auto-selected
      # dsa/flashmla_kv. Verify from the startup log rather than trusting this.
      - --hicache-io-backend=kernel
      - --hicache-mem-layout=page_first
      # The `file` backend deduplicates across TP ranks for MLA models (storage
      # keys carry no tp_rank suffix), so /scratch holds ONE copy, not eight.
      # That dedup is why the disk tier holds ~85x more unique tokens than all
      # of host RAM. It has no eviction -- see sglang/kv_reaper.py.
      - --hicache-storage-backend=file
      - --hicache-storage-prefetch-policy=timeout

  # Profile B: HiSparse long-context worker. GPU holds the DSA indexer at the
  # FULL logical size (index_buf_size = size * host_to_device_ratio) while only
  # a working set of the heavy MLA latent KV stays resident, the rest paging
  # from host RAM. That is the design that would raise the servable context
  # past 512K -- IF it started.
  #
  # IT STARTS AT 1M BUT CANNOT SERVE A REQUEST. Six attempts.
  #   1-3 (2026-08-31, mem-fraction 0.88 / 0.86 / 0.88+cuda-graph-max-bs) and
  #       4 (2026-09-01, a 786,432-token target): CUDA OOM in graph capture.
  #   5 (2026-09-01, mem-fraction 0.82 at the full 1M): OOM GONE -- capture
  #       entered with 9.16-9.63 GB free instead of 488 MiB and cleared. Died
  #       in the MTP draft model; see the speculative-decoding comment below.
  #   6 (2026-09-01, attempt 5 without MTP): STARTED and registered at
  #       context_window 1048576, max_total_num_tokens=460352,
  #       available_gpu_mem=10.52 GB, 47.11 GB host KV per rank. Then crashed
  #       on the FIRST request:
  #         TypeError: 'NoneType' object is not subscriptable
  #         hisparse_coordinator.py:535  req_idx = int(req_pool_indices_cpu[i])
  #         <- map_last_loc_to_buffer <- schedule_batch.py:2568
  #            prepare_for_decode
  #       req_pool_indices_cpu defaults to None (schedule_batch.py:1609) and is
  #       assigned only on the extend/alloc path (line 2094), so the DECODE
  #       path hands HiSparse a None. That is an SGLang bug on the plain
  #       decode path -- not hardware, not memory, not config. Profile B
  #       cannot serve at any context length until the engine is fixed.
  #       Re-test past SGLang 0.5.13.post1.
  # Full logs: RESULTS-kv-tiering.md, section "Profile B (hisparse, long
  # context)"; summary: sglang/README.md, section "Tiered KV cache".
  # NO throughput or latency numbers exist for Profile B; none are claimed.
  #
  # DO NOT reach for a smaller --context-length here. This comment used to
  # name that as the promising untried lever, on the theory that the
  # indexer's graph-capture working set scales with HiSparse's addressable
  # range. Attempt 4 measured it and it is wrong: --mem-fraction-static fixes
  # the static budget (weights + KV pool) and SGLang sizes the KV pool to
  # fill whatever is left of that budget after the weights load, so the pool
  # does NOT shrink with --context-length -- that flag only caps per-request
  # length. Going 1M -> 768K freed no GPU memory at all; it merely moved the
  # failure earlier (back into generic capture) and changed which rank ran
  # out first (48 MiB free on GPU 1 vs attempt 3's 488 MiB on GPU 6). The
  # only knob that actually resizes the pool is --mem-fraction-static. See
  # the `--mem-fraction-static` and `--cuda-graph-max-bs` comments below for
  # the attempts in detail.
  #
  # THE COST IS PREFIX CACHING, ENTIRELY, even setting the OOM aside. HiSparse
  # asserts --disable-radix-cache, so every request re-prefills from zero.
  # This is the wrong default for multi-turn, shared-prompt, and batch-corpus
  # workloads alike -- hence a separate profile rather than a flag.
  #
  # /scratch is unused here: HiSparse has no storage backend, only GPU<->host.
  worker-longctx:
    <<: *worker-base
    # Mutually exclusive with worker: SGLang forbids hierarchical cache
    # together with --disable-radix-cache, which HiSparse requires.
    profiles: ["longctx"]
    environment:
      <<: *coredump-env
      HF_HOME: "${HF_CACHE:-/root/.cache/huggingface}"
      HF_HUB_OFFLINE: "1"
    volumes:
      - "${HF_CACHE:-/root/.cache/huggingface}:${HF_CACHE:-/root/.cache/huggingface}"
      - "jit-cache:/home/dynamo/.cache"
      # Crash-dump target (see x-coredump-env). This profile mounts no KV
      # scratch tree, so the dump path must come in on its own mount.
      - "${DIAG_DIR:-/scratch/diag}:${DIAG_DIR:-/scratch/diag}"
    # SGLang engine args pass straight through. We let SGLang AUTO-SELECT the DSA
    # attention backend (no --attention-backend): on Hopper with fp8 KV it picks
    # flashmla_kv for prefill+decode, same as the aggregated worker.
    command:
      - --model-path=${MODEL:-zai-org/GLM-5.2-FP8}
      - --served-model-name=${SERVED_NAME:-glm-5.2-fp8}
      # The engine now serves the OpenAI API itself -- there is no separate
      # frontend process. network_mode: host means this binds the host's
      # interface directly, so the default is loopback ONLY. The model should
      # not be reachable over the network: front it with your own reverse proxy
      # or an SSH tunnel. Override with HTTP_HOST=0.0.0.0 (not recommended).
      - --host=${HTTP_HOST:-127.0.0.1}
      - --port=${PORT:-8000}
      - --tp-size=${TP_SIZE:-8}
      - --kv-cache-dtype=fp8_e4m3
      - --max-running-requests=${MAX_RUNNING:-128}
      - --page-size=${PAGE_SIZE:-64}
      - --trust-remote-code
      # Native SGLang parsers. These were --dyn-* under Dynamo because the
      # FRONTEND did the parsing; sglang.launch_server rejects that spelling.
      - --tool-call-parser=${TOOL_PARSER:-glm47}
      - --reasoning-parser=${REASONING_PARSER:-glm45}
      # NOT OPTIONAL, and its absence is SILENT. This is what makes the server
      # populate usage.prompt_tokens_details.cached_tokens, which bench_stream.py
      # reads as a DIRECT count of prefix-cache hits -- the measurement behind
      # the whole tiered-KV result in RESULTS-kv-tiering.md. The Dynamo frontend
      # populated it for free. Drop this flag and there is no error: the field
      # just disappears and cache effectiveness has to be guessed from TTFT.
      - --enable-cache-report
      # See the worker service: without this /metrics 404s entirely.
      - --enable-metrics
      # HiSparse selects flashmla_kv itself for fp8_e4m3 KV -- the same backend
      # the aggregated worker auto-selects. Do NOT add --attention-backend.
      - --enable-hisparse
      - --disable-radix-cache
      - '--hisparse-config={"top_k":2048,"device_buffer_size":${HISPARSE_DEVICE_BUFFER:-4096},"host_to_device_ratio":${HISPARSE_RATIO:-2}}'
      # 0.82 is the ONLY value measured to start (attempt 5, 2026-09-01): it
      # enters CUDA-graph capture with 9.16-9.63 GB free and clears it, where
      # 0.88/0.86 both OOM'd. It costs KV pool -- max_total_num_tokens=460352,
      # SMALLER than Profile A's 540928, with the remainder paging to ~377 GB
      # of host memory (47.11 GB/rank). Do not raise it back without re-testing.
      # History of the OOM attempts at the old 0.88 default, 2026-08-31:
      # Profile A at --mem-fraction-static 0.85 reports available_gpu_mem=
      # 10.09 GB/GPU. Raising to 0.88 (this default) consumes ~4.3 GB more of
      # that headroom, leaving ~5.8 GB -- 0.88 was chosen to leave that margin
      # rather than pushing toward the ~0.93 ceiling the raw headroom implies.
      # Moot in hindsight: CUDA-graph capture OOMs well below even 0.88.
      # Attempt 1 (this 0.88 default): OOM in generic graph capture, 488 MiB
      # free at failure (GPU 6). Attempt 2 (MEM_FRACTION_LONG=0.86): same
      # failure mode, *more* free memory at failure (1.24 GiB, GPU 1) but not
      # proportionally more -- freeing static memory does not translate into
      # graph-capture headroom 1:1. See the `--cuda-graph-max-bs` comment
      # below for attempt 3. Full logs: RESULTS-kv-tiering.md, section
      # "Profile B (hisparse, long context)".
      - --context-length=${MAX_MODEL_LEN_LONG:-1048576}
      - --mem-fraction-static=${MEM_FRACTION_LONG:-0.82}
      # SGLang defaults cuda_graph_max_bs to 512, but --max-running-requests caps
      # concurrency at 128, so graphs for batch sizes 129-512 can never be scheduled
      # -- they are pure wasted GPU memory. That waste is affordable under Profile A
      # and is not under Profile B: longctx attempt 2 (MEM_FRACTION_LONG=0.86,
      # see above) died with
      #   "Capture cuda graph failed: CUDA out of memory. Tried to allocate 1.31 GiB.
      #    GPU 1 has ... 1.24 GiB is free ... 1.56 GiB allocated in private pools
      #    (e.g., CUDA Graphs)"
      # i.e. it missed by ~70 MB while holding 1.56 GiB of graph pools it cannot use.
      # Capping capture at the real concurrency ceiling reclaims that -- and it
      # does help: attempt 3 (this cap, with mem-fraction back at 0.88) got past
      # generic graph capture entirely (host pools allocated, DeepGEMM warmup
      # done), then OOM'd one call deeper, inside the HiSparse indexer's OWN
      # graph capture (dsa_indexer.py::_get_topk_paged), needing 1.50 GiB with
      # only 488 MiB free and the GPU fully pinned. That is still a failure to
      # start -- see the header comment above for the lever that might close it.
      # Also shortens startup, since there are fewer graphs to capture.
      - --cuda-graph-max-bs=${CUDA_GRAPH_MAX_BS_LONG:-128}
      # NO MTP/EAGLE HERE -- IT IS BROKEN WITH HISPARSE, MEASURED 2026-09-01.
      # This used to carry the same four speculative flags as Profile A,
      # marked UNVERIFIED. Attempt 5 (mem-fraction 0.82, which cleared the
      # CUDA-graph OOM that blocked attempts 1-4) got all the way past graph
      # capture and then died in the MTP draft model on every one of the 8
      # ranks:
      #   AttributeError: 'HiSparseDSATokenToKVPool' object has no attribute
      #                   'full_to_hisparse_device_index_mapping'
      #   deepseek_nextn.py:227/350 -> deepseek_v2.py:1868 forward_absorb_core
      # The attribute is installed by HiSparseDSATokenToKVPool.register_mapping()
      # (mem_cache/hisparse_memory_pool.py), which hisparse_coordinator.py only
      # calls for the main pool -- the NextN/MTP draft model gets its own pool
      # instance that never has it registered. That is an SGLang integration
      # gap, not a memory or config problem, so it cannot be tuned around from
      # here. Re-test if the engine is ever upgraded past 0.5.13.post1.
      #
      # THE COST: Profile B gives up the ~2x single-stream decode that MTP
      # provides under Profile A. Full detail: RESULTS-kv-tiering.md, section
      # "Profile B attempt 5/6".


  # Profile C: GLM-5.3-Flash. A DIFFERENT MODEL AND A DIFFERENT IMAGE -- this
  # is not a variant of the worker above and shares none of its tuning.
  #
  # GLM-5.3-Flash is Glm5NextForCausalLM/-ForConditionalGeneration
  # (model_type glm5_next), NOT GlmMoeDsaForCausalLM: 320B total / 18B active,
  # 45 text layers of HYBRID attention -- 34 KDA (linear) + 11 DSA (full), a
  # 3:1 repeat -- 288 routed experts (8/tok), a native MTP layer, a 24-layer
  # vision encoder, and 1M context. ~306 GiB of weights vs GLM-5.2's ~756 GB.
  #
  # ENGINE: requires an SGLang build carrying glm5_next, which landed on main
  # 2026-09-06 (PR #36507) -- ONE DAY AFTER the v0.5.19 release. It is in NO
  # public SGLang release, so `pip install sglang==<any released version>`
  # cannot serve this model and our glm52 image (0.5.13.post1) has no
  # Glm5Next class at all. Upstream ships a purpose-built CUDA 13 image and
  # says the nightlies do not work either. Hence the hardcoded image below.
  #
  # Flags follow upstream's VERIFIED 8xH200 TP8/EP8 cell, cookbook
  # docs/cookbook/autoregressive/GLM/GLM-5.3-Flash.mdx (config snippet
  # docs/src/snippets/configs/zai-org/glm-5.3-flash.jsx). Support is days old
  # with an active bug tracker (sgl-project/sglang#37524) -- re-check it
  # before trusting any of this in production.
  worker-flash:
    <<: *worker-base
    profiles: ["flash"]
    # NOT ${SGLANG_IMAGE}: that defaults to the GLM-5.2 image, which cannot
    # load this architecture. Overridable, but the override must also carry
    # glm5_next.
    image: ${SGLANG_FLASH_IMAGE:-lmsysorg/sglang:glm-5.3-flash}
    environment:
      <<: *coredump-env
      HF_HOME: "${HF_CACHE:-/root/.cache/huggingface}"
      HF_HUB_OFFLINE: "1"
      # L3 tier target. Its own directory, NOT glm52's: hicache storage keys
      # carry no model identity, so pointing two different models at one
      # directory would let them collide on the same cache keys.
      # HiCacheFile defaults to /tmp/hicache (the root filesystem) if unset --
      # setting it is not optional. serve.sh probes it before start.
      SGLANG_HICACHE_FILE_BACKEND_STORAGE_DIR: "${KV_SCRATCH_DIR:-/scratch/kvcache/glm53}"
    volumes:
      - "${HF_CACHE:-/root/.cache/huggingface}:${HF_CACHE:-/root/.cache/huggingface}"
      - "jit-cache:/home/dynamo/.cache"
      # L3 KV tier. Separate NVMe from /data (the weight cache) so cache I/O
      # does not contend with weight loading.
      - "${KV_SCRATCH_ROOT:-/scratch/kvcache}:${KV_SCRATCH_ROOT:-/scratch/kvcache}"
      # Crash dumps: this model is new enough that a hang is worth capturing.
      - "${DIAG_DIR:-/scratch/diag}:${DIAG_DIR:-/scratch/diag}"
    command:
      - --model-path=${FLASH_MODEL:-zai-org/GLM-5.3-Flash}
      - --served-model-name=${FLASH_SERVED_NAME:-glm-5.3-flash}
      - --host=${HTTP_HOST:-127.0.0.1}
      - --port=${PORT:-8000}
      - --tp-size=${TP_SIZE:-8}
      # EP=8 alongside TP=8: in the verified cell, absent from our GLM-5.2
      # worker. 288 routed experts make expert parallelism worth having.
      - --ep-size=${FLASH_EP_SIZE:-8}
      # ---- KV dtype and DSA backends MUST move together --------------------
      # bfloat16 + tilelang, NOT the fp8_e4m3 we run for GLM-5.2. On Hopper,
      # upstream DISABLES fp8 KV: "FP8 KV cache with TRT-LLM DSA is not
      # supported on Hopper GPUs", and "TileLang DSA with FP8 KV is not a
      # valid CUDA combination". fp8_e4m3 is a silent-looking carryover that
      # is actually invalid here. The fp8+trtllm pairing is Blackwell-only.
      - --kv-cache-dtype=bfloat16
      - --dsa-prefill-backend=tilelang
      - --dsa-decode-backend=tilelang
      # Unlike the GLM-5.2 worker we do NOT rely on auto-selection: the
      # verified cell names both backends explicitly.
      - --moe-runner-backend=deep_gemm
      - --mem-fraction-static=${FLASH_MEM_FRACTION:-0.75}
      # ---- The knob that actually governs concurrency ----------------------
      # This model keeps TWO pools: the paged KV pool AND a separate KDA
      # (linear-attention) state pool. Upstream: "The KDA state pool can limit
      # concurrency before the KV pool is full. If startup reduces
      # max_running_requests because of KDA state capacity, increase
      # --mamba-full-memory-ratio or set --max-mamba-cache-size."
      # 0.9 is the engine default and explicitly "a generic starting point
      # rather than a workload-tuned split" -- too low starves the KDA pool
      # and clamps max_running_requests, too high shrinks the KV pool. Tune it
      # from the two pool sizes the worker prints in ONE boot log. This has no
      # analogue in the GLM-5.2 profiles; it is the first thing to measure.
      - --mamba-full-memory-ratio=${MAMBA_RATIO:-0.9}
      # MEASURED 2026-09-12 (RESULTS-glm53-sweep.md). The engine default is
      # None, which resolves to float32 -- an explicit --mamba-ssm-dtype
      # float32 run produced byte-identical pool sizes, confirming it. Half
      # precision on the KDA recurrent state nearly DOUBLES how many sequences
      # the state pool holds, at the same memory, and leaves room for a bigger
      # KV pool:
      #     float32 (default): max_mamba_cache_size  798, max_total_num_tokens 3,500,608
      #     bfloat16         : max_mamba_cache_size 1548, max_total_num_tokens 3,687,104
      # These are boot-log pool allocations, not throughput, so unlike the rest
      # of that sweep they are not subject to its ~24% run-to-run noise.
      # GSM8K on bfloat16 was verified before adopting -- see the sweep doc.
      - --mamba-ssm-dtype=${MAMBA_SSM_DTYPE:-bfloat16}
      # ---- Parsers ---------------------------------------------------------
      # Same values as GLM-5.2 today. Upstream has an open issue to add a
      # dedicated glm53 tool-call detector (sgl-project/sglang#37925); revisit
      # TOOL_PARSER when that lands.
      - --tool-call-parser=${TOOL_PARSER:-glm47}
      - --reasoning-parser=${REASONING_PARSER:-glm45}
      # The checkpoint's own generation_config.json specifies temperature 1.0 /
      # top_p 0.95, and upstream's GSM8K recipe for this model uses the same.
      # Without this flag the engine does NOT pick them up: /get_model_info
      # reported preferred_sampling_params=null, so any client that omits
      # temperature/top_p silently got engine defaults instead of the values
      # the model was tuned for. Setting it both applies them as defaults and
      # advertises them to clients via /get_model_info.
      - '--preferred-sampling-params={"temperature":1.0,"top_p":0.95}'
      # Not in the upstream cell, kept from our stack: without it
      # usage.prompt_tokens_details.cached_tokens silently disappears and
      # bench_stream.py loses its direct prefix-cache-hit count.
      - --enable-cache-report
      # See the worker service: without this /metrics 404s entirely.
      - --enable-metrics
      # ---- Speculative decoding (Strategy: Low Latency) --------------------
      # Adaptive MTP 5/1/6 -- deeper than GLM-5.2's 2/1/3, plus the adaptive
      # flag, which the verified low-latency cell carries. For the High
      # Throughput operating point, DELETE all five flags (spec decode off);
      # under sustained batches the draft-and-verify overhead can cost more
      # than it returns. Measure both before choosing.
      # NOTE: adaptive MTP is incompatible with DP-attention -- the server
      # falls back to a static draft depth and warns. Do not add --dp-size.
      - --speculative-algorithm=${SPEC_ALGO:-EAGLE}
      - --speculative-num-steps=${FLASH_SPEC_NUM_STEPS:-5}
      - --speculative-eagle-topk=${FLASH_SPEC_EAGLE_TOPK:-1}
      - --speculative-num-draft-tokens=${FLASH_SPEC_NUM_DRAFT:-6}
      - --speculative-adaptive
      # ---- Tiered KV cache (GPU radix -> host RAM L2 -> /scratch L3) -------
      # NOTE: upstream's verified cell has HiCache OFF and says "Keep HiCache
      # off when GPU memory is sufficient". Measured on this box at boot,
      # max_total_num_tokens = 3,500,608 -- 6.5x GLM-5.2's 540,928, because
      # only 11 of 45 layers hold a paged KV cache (the other 34 are KDA
      # linear-attention state). So GPU memory IS sufficient by upstream's
      # standard and these flags are an explicit local choice, NOT the
      # upstream recommendation. Upstream marks every HiCache option
      # "Not Verified" for this model (see sgl-project/sglang#38474).
      #
      # DO NOT turn this off on the strength of RESULTS-glm53-hicache-ab.md.
      # That A/B shows HiCache costing ~38% of sustained throughput, but it
      # drives ONE 2000-token shared prefix, which the 3.5M-token GPU radix
      # cache absorbs entirely (97.8% hit) -- so the host/disk tiers take
      # every write and serve no recall the GPU tier would not have served.
      # It measures HiCache's cost in the one case where it has no upside.
      # This deployment runs long agentic loops (tool-using agents, judging
      # loops, LangChain deep agents) whose real prompts are ~100K+ tokens
      # -- measured mean TTFT 16.6 s over 35,551 production requests, vs
      # 130-180 ms for the benchmark's 2K prompts. At that context size 64
      # concurrent requests DO overflow the GPU pool, which is the case the
      # tiers exist for. See docs/hicache-workload-fit.md.
      #
      # --hicache-size is PER TP RANK: 32 GB/rank => ~256 GB of host pool at
      # TP=8. Upstream suggests 32 and warns the default ratio "can demand
      # more host RAM than the node has free". GLM-5.2 used 96/rank (~770 GB);
      # do not copy that number here without checking free host RAM first.
      - --enable-hierarchical-cache
      - --hicache-size=${HICACHE_GB:-32}
      # write_through writes EVERY page to host and /scratch synchronously.
      # Measured on GLM-5.2: ~8.7% system throughput cost at concurrency 32.
      # write_through_selective writes only hotter pages. Override to A/B.
      # write_through_selective, NOT write_through. Measured 2026-09-12: plain
      # write_through collapsed concurrency-1 throughput to 109 tok/s vs
      # 207-247 for every other config, with ITL p99 98.7 ms vs ~13 ms -- the
      # signature of synchronous per-page writes stalling decode. That gap was
      # the ONLY throughput difference in the sweep large enough to clear its
      # ~24% noise floor. Do not revert to write_through without re-measuring.
      - --hicache-write-policy=${HICACHE_WRITE_POLICY:-write_through_selective}
      # `kernel` I/O is downgraded to `direct` only when the effective DECODE
      # backend is fa3; ours is tilelang. VERIFIED 2026-09-12: no downgrade in
      # any of the 5 sweep runs (io_backend_downgraded False throughout).
      - --hicache-io-backend=kernel
      - --hicache-mem-layout=page_first
      # `file`, not `mooncake`: upstream lists mooncake as the L3 option, but
      # that is a multi-NODE KV store (see docs/Mooncake.md). On one node it
      # adds a service and buys nothing over a local directory.
      - --hicache-storage-backend=file
      - --hicache-storage-prefetch-policy=timeout
      # ---- Deliberately NOT set --------------------------------------------
      # Prefix caching stays ON (it is not hicache); upstream: "Keep the
      #   prefix cache enabled for every strategy."
      # --context-length: the verified cell does not pin it; the model is 1M
      #   native. Set MAX_MODEL_LEN-style only after the boot log shows what
      #   the two pools actually allow.
      # --page-size: GLM-5.2 needs 64 for its DSA indexer; the 5.3 cell does
      #   not set it. Leave the engine default until measured.
      # --max-running-requests: tune AFTER --mamba-full-memory-ratio, since
      #   the KDA pool is what clamps it.
      # --json-model-override-args: do NOT override linear_lower_bound.
      #   Upstream: "Keep the checkpoint's KDA lower-bound setting unchanged."
      # --dcp-size: DCP is validated only on 4x GB300 for now.
      # --trust-remote-code: glm5_next is natively supported; the cell omits it.

volumes:
  jit-cache:   # persisted JIT kernel cache (fast worker restarts)
