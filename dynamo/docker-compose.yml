# NVIDIA Dynamo serving stack for GLM-5.2-FP8 on 8x H200.
#
# Engine: Dynamo SGLang backend (custom image: SGLang 0.5.13.post1). SGLang is
# NVIDIA's blessed path for GLM-5 on Dynamo and auto-selects the DSA (DeepSeek-style
# Sparse Attention) kernels for GLM-5.2. We use it because no Dynamo vLLM runtime
# ships vLLM >= 0.23.0 yet (required by the vLLM path for head_size=704 sparse MLA).
#
# Topology: single-node, AGGREGATED tensor-parallel over all 8 GPUs (TP=8) + MTP/EAGLE
# speculative decoding. We benchmarked SGLang's "throughput" config (EP=8 +
# --enable-dp-attention) and it REGRESSED on every axis -- ~0.6x system
# tok/s at conc 32 and worse single-stream latency -- because DP-attention only pays
# off at hundreds of concurrent requests, while one node caps at 48 max-running-reqs
# (6/rank); below that the DP+EP all-to-all overhead isn't amortized, and the replicated
# attention weights shrink the KV pool (540k -> 292k tokens). So TP=8 stays. The EP+DP
# config is the right choice only on >= 2 nodes / very high concurrency. (Disaggregated
# prefill/decode -- a full model copy per worker -- also needs >= 2 nodes.)
#
# All services use host networking, so the frontend binds :8000 on the host and
# workers reach etcd (:2379) / nats (:4222) over localhost.

x-dynamo-env: &dynamo-env
  ETCD_ENDPOINTS: "http://localhost:2379"
  NATS_SERVER: "nats://localhost:4222"

# Shared base for SGLang worker services (Profile A "cache" below; Profile B
# "longctx" is added alongside it on this branch). YAML merge (<<:) replaces
# whole keys wholesale, so profiles/environment/volumes/command stay spelled
# out explicitly in each worker service rather than living here.
x-worker-base: &worker-base
  image: ${DYNAMO_IMAGE:-glm52-dynamo-sglang:0.5.13post1}
  network_mode: host
  gpus: all
  ipc: host
  # The image runs the worker directly as pid 1, with no init to reap children.
  # Without this, the container became UNKILLABLE on teardown: `./stop.sh`
  # reported "PID ... is zombie and can not be killed", `docker restart` failed
  # outright leaving the worker DOWN, and `docker compose up -d worker` refused
  # to recreate it -- all needing a manual `docker kill` first. docker-init as
  # pid 1 forwards signals and reaps, and that symptom is gone: stop and
  # recreate now complete unaided (verified 2026-08-31/09-01).
  #
  # It does NOT stop the exit-137 teardown, and cannot. Measured on a fully
  # loaded worker 2026-09-01: SIGTERM 01:41:51 -> engine shutdown complete
  # 01:41:57 -> container SIGKILLed 01:42:35. ExitCode 137, `docker stop` rc=1
  # after 24s. The cause is upstream and unrelated to reaping: the shutdown
  # handler calls kill_process_tree(parent_pid=<engine>, include_parent=False),
  # which kills the engine's children but never terminates the engine process
  # itself, so pid 1 waits on a child that never exits and docker SIGKILLs at
  # the stop timeout. The long tail after SIGKILL is most likely the kernel
  # reclaiming ~920 GB of pinned host pools (96 GB + 19.32 GB per rank x 8) --
  # plausible but NOT measured, so treat it as a hypothesis.
  #
  # 137 here is cosmetic: the graceful path already finished at +6s (endpoints
  # unregistered, engine shut down, KV files flushed). Everything after is
  # process teardown. Do not chase it without an upstream fix.
  init: true
  ulimits:
    memlock: -1
    stack: 67108864
  depends_on: [etcd, nats]
  entrypoint: ["python3", "-m", "dynamo.sglang"]
  restart: "no"

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    network_mode: host
    command:
      - etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://localhost:2379
    volumes:
      - etcd-data:/etcd-data
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    network_mode: host
    command: ["-js", "-m", "8222"]   # JetStream on, monitoring on :8222
    restart: unless-stopped

  frontend:
    image: ${DYNAMO_IMAGE:-glm52-dynamo-sglang:0.5.13post1}
    network_mode: host
    environment:
      <<: *dynamo-env
      # The frontend loads the model's config/tokenizer (not weights) on discovery.
      # Point it at the local HF cache + offline so it doesn't try huggingface.co
      # (no internet/proxy in-container).
      HF_HOME: "${HF_CACHE:-/root/.cache/huggingface}"
      HF_HUB_OFFLINE: "1"
      # Bind the OpenAI HTTP API to loopback ONLY (not 0.0.0.0). The model should
      # not be reachable directly over the network — front it with your own reverse
      # proxy or expose it over a restricted SSH tunnel as needed.
      # Override with HTTP_HOST=0.0.0.0 to re-expose (not recommended).
      DYN_HTTP_HOST: "${HTTP_HOST:-127.0.0.1}"
    volumes:
      - "${HF_CACHE:-/root/.cache/huggingface}:${HF_CACHE:-/root/.cache/huggingface}"
    depends_on: [etcd, nats]
    entrypoint: ["python3", "-m", "dynamo.frontend"]
    command: ["--http-port", "${PORT:-8000}"]
    restart: unless-stopped

  # Aggregated worker: full model, tensor-parallel over all 8 GPUs (TP=8) + MTP.
  worker:
    <<: *worker-base
    # Profile A: tiered KV cache (GPU radix -> host RAM L2 -> /scratch L3).
    # Mutually exclusive with worker-longctx: SGLang forbids hierarchical cache
    # together with --disable-radix-cache, which HiSparse requires.
    profiles: ["cache"]
    environment:
      <<: *dynamo-env
      HF_HOME: "${HF_CACHE:-/root/.cache/huggingface}"
      HF_HUB_OFFLINE: "1"
      # HiCacheFile defaults to /tmp/hicache -- the 438 GB ROOT filesystem --
      # if this is unset, which would fill the boot disk. Setting it is not
      # optional. serve.sh fails fast if the directory is missing.
      SGLANG_HICACHE_FILE_BACKEND_STORAGE_DIR: "${KV_SCRATCH_DIR:-/scratch/kvcache/glm52}"
    volumes:
      - "${HF_CACHE:-/root/.cache/huggingface}:${HF_CACHE:-/root/.cache/huggingface}"
      # Persist JIT-compiled kernels (DeepGEMM, FlashInfer, Triton, tvm-ffi) across
      # container recreation so restarts skip the ~10-20 min DeepGEMM precompile +
      # warmup. The cache dir exists in the image owned by the 'dynamo' user, so the
      # named volume inherits that ownership on first mount (writes succeed).
      - "dynamo-jit-cache:/home/dynamo/.cache"
      # L3 KV tier. Separate NVMe devices from /data (the weight cache), so
      # cache I/O does not contend with weight loading.
      - "${KV_SCRATCH_ROOT:-/scratch/kvcache}:${KV_SCRATCH_ROOT:-/scratch/kvcache}"
    # SGLang engine args pass straight through. We let SGLang AUTO-SELECT the DSA
    # attention backend (no --attention-backend): on Hopper with fp8 KV it picks
    # flashmla_kv for prefill+decode. Parsers are the Dynamo-side (frontend) parsers.
    command:
      - --model-path=${MODEL:-zai-org/GLM-5.2-FP8}
      - --served-model-name=${SERVED_NAME:-glm-5.2-fp8}
      - --tp-size=${TP_SIZE:-8}
      - --kv-cache-dtype=fp8_e4m3
      - --mem-fraction-static=${MEM_FRACTION:-0.85}
      # Concurrency ceiling. Spec decoding auto-caps this to 48; set it explicitly
      # to run more requests in parallel before they queue. KV pool is ~540k tokens,
      # so 128 leaves ~4k tokens/req of avg budget. Raise for high-concurrency
      # workloads (weigh against per-request decode speed). Override via MAX_RUNNING.
      - --max-running-requests=${MAX_RUNNING:-128}
      # DSA indexer requires page_size 64. (Backend is auto-selected -- see above.)
      - --page-size=${PAGE_SIZE:-64}
      # 1M is the model's max, but a single node can't hold a 1M-token KV cache
      # alongside the ~94 GB/GPU weights: at mem-fraction 0.85 the decode pool is
      # ~540k tokens (max_total_num_tokens=540800), so 512k is the largest length
      # a full-length request can actually be served at. (True 1M needs >= 2 nodes.)
      # Override with MAX_MODEL_LEN if you change memory.
      - --context-length=${MAX_MODEL_LEN:-524288}
      - --trust-remote-code
      - --dyn-tool-call-parser=glm47
      - --dyn-reasoning-parser=glm45
      # MTP speculative decoding: GLM-5.2 ships 1 MTP layer; EAGLE drives it from the
      # main checkpoint (no separate draft model). topk=1 => a draft chain, so
      # num-draft-tokens == num-steps + 1. Verified to compose with the auto-selected
      # DSA backend on H200 (accept len ~2.2-2.8); env-overridable for tuning.
      - --speculative-algorithm=${SPEC_ALGO:-EAGLE}
      - --speculative-num-steps=${SPEC_NUM_STEPS:-2}
      - --speculative-eagle-topk=${SPEC_EAGLE_TOPK:-1}
      - --speculative-num-draft-tokens=${SPEC_NUM_DRAFT:-3}
      # --- Tiered KV cache -------------------------------------------------
      # See docs/superpowers/specs/2026-08-31-scratch-kv-cache-tiering-design.md
      #
      # --hicache-size is PER TP RANK: HostKVCache.__init__ reads it as this
      # rank's own pool (host_size * 1e9 // size_per_token), so TP=8 allocates
      # it EIGHT times -- MLA makes all eight copies identical, but they are
      # still eight allocations. 96 GB/rank => ~770 GB of MLA host pool plus
      # 19.32 GB/rank of DSA indexer host pool = ~922 GB of the ~2168 GB free.
      # (19.32 GB/rank is the value the worker LOGS at startup -- "Allocating
      # 19.32 GB host memory for DSA indexer" x8 -- not the 22.0 GB/rank the
      # pre-work design doc estimated.)
      # SGLang hard-fails at startup if it over-requests, so raising this is
      # fail-safe, not fail-dangerous.
      - --enable-hierarchical-cache
      - --hicache-size=${HICACHE_GB:-96}
      # write_through writes EVERY page to the host and /scratch tiers synchronously.
      # Measured 2026-08-31: that costs ~8.7% system throughput at concurrency 32
      # (1905.2 vs 2087.1 tok/s baseline) while concurrency 1 is unaffected (-0.5%),
      # which is the signature of per-page write overhead concentrating where pages
      # are produced fastest. write_through_selective writes only hotter pages.
      # Override to A/B without editing this file.
      - --hicache-write-policy=${HICACHE_WRITE_POLICY:-write_through}
      # `kernel` I/O survives here: it is only downgraded to `direct` when the
      # effective DECODE backend is fa3, and ours is the auto-selected
      # dsa/flashmla_kv. Verify from the startup log rather than trusting this.
      - --hicache-io-backend=kernel
      - --hicache-mem-layout=page_first
      # The `file` backend deduplicates across TP ranks for MLA models (storage
      # keys carry no tp_rank suffix), so /scratch holds ONE copy, not eight.
      # That dedup is why the disk tier holds ~85x more unique tokens than all
      # of host RAM. It has no eviction -- see dynamo/kv_reaper.py.
      - --hicache-storage-backend=file
      - --hicache-storage-prefetch-policy=timeout

  # Profile B: HiSparse long-context worker. GPU holds the DSA indexer at the
  # FULL logical size (index_buf_size = size * host_to_device_ratio) while only
  # a working set of the heavy MLA latent KV stays resident, the rest paging
  # from host RAM. That is the design that would raise the servable context
  # past 512K -- IF it started.
  #
  # IT DOES NOT START ON THIS HARDWARE. Measured 2026-08-31, three attempts
  # (default mem-fraction 0.88, reduced mem-fraction 0.86, reduced
  # cuda-graph-max-bs) all hit CUDA OOM during CUDA-graph capture; none
  # reached a registered state. Full logs: RESULTS-kv-tiering.md, section
  # "Profile B (hisparse, long context)"; summary: dynamo/README.md, section
  # "Tiered KV cache". The untried lever is a smaller --context-length for
  # this profile -- the indexer's own graph-capture working set scales with
  # HiSparse's addressable range (currently the full 1,048,576-token target),
  # not with concurrency, which is why graph-count and mem-fraction tuning
  # alone cannot close the gap. See the `--mem-fraction-static` and
  # `--cuda-graph-max-bs` comments below for the three attempts in detail.
  #
  # THE COST IS PREFIX CACHING, ENTIRELY, even setting the OOM aside. HiSparse
  # asserts --disable-radix-cache, so every request re-prefills from zero.
  # This is the wrong default for multi-turn, shared-prompt, and batch-corpus
  # workloads alike -- hence a separate profile rather than a flag.
  #
  # /scratch is unused here: HiSparse has no storage backend, only GPU<->host.
  worker-longctx:
    <<: *worker-base
    # Mutually exclusive with worker: SGLang forbids hierarchical cache
    # together with --disable-radix-cache, which HiSparse requires.
    profiles: ["longctx"]
    environment:
      <<: *dynamo-env
      HF_HOME: "${HF_CACHE:-/root/.cache/huggingface}"
      HF_HUB_OFFLINE: "1"
    volumes:
      - "${HF_CACHE:-/root/.cache/huggingface}:${HF_CACHE:-/root/.cache/huggingface}"
      - "dynamo-jit-cache:/home/dynamo/.cache"
    # SGLang engine args pass straight through. We let SGLang AUTO-SELECT the DSA
    # attention backend (no --attention-backend): on Hopper with fp8 KV it picks
    # flashmla_kv for prefill+decode, same as the aggregated worker. Parsers are
    # the Dynamo-side (frontend) parsers.
    command:
      - --model-path=${MODEL:-zai-org/GLM-5.2-FP8}
      - --served-model-name=${SERVED_NAME:-glm-5.2-fp8}
      - --tp-size=${TP_SIZE:-8}
      - --kv-cache-dtype=fp8_e4m3
      - --max-running-requests=${MAX_RUNNING:-128}
      - --page-size=${PAGE_SIZE:-64}
      - --trust-remote-code
      - --dyn-tool-call-parser=glm47
      - --dyn-reasoning-parser=glm45
      # HiSparse selects flashmla_kv itself for fp8_e4m3 KV -- the same backend
      # the aggregated worker auto-selects. Do NOT add --attention-backend.
      - --enable-hisparse
      - --disable-radix-cache
      - '--hisparse-config={"top_k":2048,"device_buffer_size":${HISPARSE_DEVICE_BUFFER:-4096},"host_to_device_ratio":${HISPARSE_RATIO:-2}}'
      # Does NOT start on this hardware at this default. Measured 2026-08-31:
      # Profile A at --mem-fraction-static 0.85 reports available_gpu_mem=
      # 10.09 GB/GPU. Raising to 0.88 (this default) consumes ~4.3 GB more of
      # that headroom, leaving ~5.8 GB -- 0.88 was chosen to leave that margin
      # rather than pushing toward the ~0.93 ceiling the raw headroom implies.
      # Moot in hindsight: CUDA-graph capture OOMs well below even 0.88.
      # Attempt 1 (this 0.88 default): OOM in generic graph capture, 488 MiB
      # free at failure (GPU 6). Attempt 2 (MEM_FRACTION_LONG=0.86): same
      # failure mode, *more* free memory at failure (1.24 GiB, GPU 1) but not
      # proportionally more -- freeing static memory does not translate into
      # graph-capture headroom 1:1. See the `--cuda-graph-max-bs` comment
      # below for attempt 3. Full logs: RESULTS-kv-tiering.md, section
      # "Profile B (hisparse, long context)".
      - --context-length=${MAX_MODEL_LEN_LONG:-1048576}
      - --mem-fraction-static=${MEM_FRACTION_LONG:-0.88}
      # SGLang defaults cuda_graph_max_bs to 512, but --max-running-requests caps
      # concurrency at 128, so graphs for batch sizes 129-512 can never be scheduled
      # -- they are pure wasted GPU memory. That waste is affordable under Profile A
      # and is not under Profile B: longctx attempt 2 (MEM_FRACTION_LONG=0.86,
      # see above) died with
      #   "Capture cuda graph failed: CUDA out of memory. Tried to allocate 1.31 GiB.
      #    GPU 1 has ... 1.24 GiB is free ... 1.56 GiB allocated in private pools
      #    (e.g., CUDA Graphs)"
      # i.e. it missed by ~70 MB while holding 1.56 GiB of graph pools it cannot use.
      # Capping capture at the real concurrency ceiling reclaims that -- and it
      # does help: attempt 3 (this cap, with mem-fraction back at 0.88) got past
      # generic graph capture entirely (host pools allocated, DeepGEMM warmup
      # done), then OOM'd one call deeper, inside the HiSparse indexer's OWN
      # graph capture (dsa_indexer.py::_get_topk_paged), needing 1.50 GiB with
      # only 488 MiB free and the GPU fully pinned. That is still a failure to
      # start -- see the header comment above for the lever that might close it.
      # Also shortens startup, since there are fewer graphs to capture.
      - --cuda-graph-max-bs=${CUDA_GRAPH_MAX_BS_LONG:-128}
      # MTP/EAGLE is carried over UNVERIFIED: nothing in SGLang forbids it with
      # HiSparse and nothing exercises it either. If startup fails citing
      # speculative decoding, delete these four lines and re-run -- Profile B
      # then loses the ~2x single-stream decode MTP provides, which must be
      # recorded in RESULTS-kv-tiering.md.
      - --speculative-algorithm=${SPEC_ALGO:-EAGLE}
      - --speculative-num-steps=${SPEC_NUM_STEPS:-2}
      - --speculative-eagle-topk=${SPEC_EAGLE_TOPK:-1}
      - --speculative-num-draft-tokens=${SPEC_NUM_DRAFT:-3}

volumes:
  etcd-data:
  dynamo-jit-cache:   # persisted JIT kernel cache (fast worker restarts)
